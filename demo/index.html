  <body>
    <main id="demo">
      <noscript>
        <h1>Crumple</h1>
        <p>
          An FFGL effect that prints your clip on a sheet of paper and crumples
          it under a lamp. Paper bends but doesn't stretch, so the print gets
          pulled in where the sheet tilts and kinks at every crease, which is
          the giveaway of real crumpled paper that a texture overlay can't fake.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/crumple">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/crumple/">Project page and downloads</a></li>
          <li><a href="https://github.com/stoatworks-labs/crumple">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
